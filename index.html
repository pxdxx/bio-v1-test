<!DOCTYPE html>
<html lang="ru" data-theme="green">
<head>

  <title>pxdx</title>
  <meta name="description" content="Tractor — My test bio">
  <meta name="theme-color" content="#07130d">

<body>
  <main class="stage">
    <article class="card" id="card">
      <!-- animated mesh gradient + grain -->
      <div class="mesh" aria-hidden="true">
        <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>
      </div>
      <div class="grain" aria-hidden="true"></div>

      <!-- banner (visible only in the light theme) -->
      <div class="banner" aria-hidden="true">
        <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
        <div class="grain"></div>
      </div>

      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Сменить тему">

        </div>

          <button class="btn-icon" id="shareBtn" type="button" aria-label="Скопировать ссылку">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>

        <div class="stat">
